user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
	client_max_body_size 16M;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
		listen [::]:80 default_server;
		listen 80 default_server;
		server_name _;

		sendfile off;
		tcp_nodelay on;
		absolute_redirect off;

		root /var/www/html/public;
		index index.php;

		location / {
			# Static files never reach PHP, so Laravel cannot set these. Only here: PHP responses (the
			# /index.php fallback is served by the location below) already get them from the SecurityHeaders
			# middleware, and sending them twice would be invalid for X-Frame-Options.
			# widget.js is embedded on other sites: never add Cross-Origin-Resource-Policy same-origin to it.
			add_header X-Content-Type-Options "nosniff" always;
			add_header X-Frame-Options "DENY" always;

			try_files $uri $uri/ /index.php?q=$uri&$args;
		}

		location ~ \.php$ {
			try_files $uri =404;
			fastcgi_split_path_info ^(.+\.php)(/.+)$;
			fastcgi_pass unix:/run/php/php8.4-fpm.sock;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_param SCRIPT_NAME $fastcgi_script_name;
			fastcgi_index index.php;
			include fastcgi_params;
		}

		location ~ /\. {
			log_not_found off;
			deny all;
		}
	}
}