# Development setup only. Backing services (MariaDB, Redis, Qdrant, TEI, Mailpit) are bound to 127.0.0.1.
# In production publish only nginx and Reverb, both behind TLS, and keep every other service on the
# internal network without published ports.
services:
    webapp:
        build:
            context: .docker/app
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
                MYSQL_CLIENT: mariadb-client
        image: 'laravel-nginx-fpm'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8080}:80'
            - '${REVERB_EXPOSED_PORT:-8090}:8090'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.docker/app/nginx.conf:/etc/nginx/nginx.conf'
            - '.docker/app/supervisord.conf:/etc/supervisord.conf'
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - webapp_mariadb
            - webapp_redis
            - webapp_mailpit
    webapp_embeddings:
        image: '${EMBEDDINGS_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.7}'
        platform: '${CONTAINER_PLATFORM:-linux/amd64}'
        ports:
            - '127.0.0.1:8081:80'
        environment:
            MODEL_ID: intfloat/multilingual-e5-small
        volumes:
            - 'embeddings_data:/data'
        networks:
            - sail
    webapp_mariadb:
        image: 'mariadb:11'
        ports:
            - '127.0.0.1:${DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'webapp_mariadb:/var/lib/mysql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - healthcheck.sh
                - '--connect'
                - '--innodb_initialized'
            retries: 3
            timeout: 5s
    webapp_redis:
        image: 'redis:alpine'
        environment:
            REDIS_PASSWORD: '${REDIS_PASSWORD}'
        command: redis-server --requirepass ${REDIS_PASSWORD}
        ports:
            - '127.0.0.1:${REDIS_PORT:-6379}:6379'
        networks:
            - sail
        healthcheck:
            test:
                - CMD-SHELL
                - 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'
            retries: 3
            timeout: 5s
    webapp_mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '127.0.0.1:1025:1025'
            - '127.0.0.1:8025:8025'
        networks:
            - sail
    webapp_qdrant:
        image: 'qdrant/qdrant:v1.20.2'
        environment:
            QDRANT__SERVICE__API_KEY: '${QDRANT_API_KEY}'
        networks:
            - sail
        ports:
         - '127.0.0.1:6333:6333'
        volumes:
         - 'qdrant_data:/qdrant/storage'
networks:
    sail:
        driver: bridge
volumes:
    webapp_mariadb:
        driver: local
    qdrant_data:
        driver: local
    embeddings_data:
        driver: local
