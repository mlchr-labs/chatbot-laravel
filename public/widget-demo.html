<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo do widget</title>
</head>
<body style="font-family: sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem;">
    <h1>Página de demonstração</h1>
    <p>Conteúdo qualquer da página host. O chat deve aparecer no canto inferior.</p>
    <p>Apenas para desenvolvimento local. Exclua ou proteja este arquivo em produção.</p>

    <!--
      Como testar:
      1. Rode `pnpm build:widget` para gerar public/widget.js.
      2. Substitua pk_REPLACE_ME pela public_key do chatbot (aba Widget no painel).
      3. No chatbot, adicione `localhost:8080` (APP_PORT) em "domínios permitidos",
         porque o header Origin desta página será http://localhost:8080.
      4. Abra http://localhost:8080/widget-demo.html
    -->
    <script src="/widget.js" data-chatbot="pk_REPLACE_ME" async></script>
</body>
</html>
